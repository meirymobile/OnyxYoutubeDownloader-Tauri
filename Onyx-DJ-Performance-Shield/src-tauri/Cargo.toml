[package]
name = "onyx-dj-performance-shield"
version = "1.0.0"
description = "Onyx DJ Performance Shield - macOS Process & Distraction Shield for Live DJing"
authors = ["DJ Shazz", "Meir"]
edition = "2021"

[lib]
name = "onyx_dj_performance_shield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.5.0"
