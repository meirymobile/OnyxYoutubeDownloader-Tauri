<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Shazz & DJ Sonic | Laser Rave Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #020204;
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px 36px;
    }

    #laser-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.4);
      border-radius: 999px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00ff88;
      margin-bottom: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
      animation: pulseGreen 1.5s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.8); }
    }

    .dj-names {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(26px, 7.5vw, 36px);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.2;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #00ff88 50%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.4));
    }
    .dj-subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #ff007f;
      text-transform: uppercase;
      margin-bottom: 26px;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
    }

    /* Cyber Rave Card */
    .party-card {
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      backdrop-filter: blur(25px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(0, 255, 136, 0.15),
                  0 0 50px rgba(255, 0, 127, 0.1);
      position: relative;
      overflow: hidden;
    }
    .party-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #00ff88, #ff007f, #00ff88);
      animation: borderScan 3s linear infinite;
    }
    @keyframes borderScan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .speaker-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, rgba(255, 0, 127, 0.1) 100%);
      border: 1px solid rgba(0, 255, 136, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
      animation: subBounce 1s infinite alternate ease-in-out;
    }
    @keyframes subBounce {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.05); }
    }
    .speaker-icon svg {
      width: 32px;
      height: 32px;
      color: #00ff88;
      filter: drop-shadow(0 0 8px #00ff88);
    }

    .main-message {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .sub-message {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      font-weight: 300;
      margin-bottom: 24px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      background: linear-gradient(135deg, #00ff88, #059669);
      border-radius: 16px;
      color: #000;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 8px 25px rgba(0, 255, 136, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 255, 136, 0.55);
    }
    .secondary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(255, 0, 127, 0.08);
      border: 1px solid rgba(255, 0, 127, 0.35);
      border-radius: 16px;
      color: #ff80bf;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.25s ease;
    }
    .secondary-btn:hover {
      background: rgba(255, 0, 127, 0.2);
    }

    footer {
      position: relative;
      z-index: 2;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: #475569;
      letter-spacing: 2px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <canvas id="laser-canvas"></canvas>

  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      STANDBY MODE
    </div>

    <h1 class="dj-names">DJ SHAZZ<br><span style="font-size: 0.7em; color: #ff007f;">&amp;</span> DJ SONIC</h1>
    <div class="dj-subtitle">High Energy Arena</div>

    <div class="party-card">
      <div class="speaker-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </div>

      <h2 class="main-message">SYSTEM IN STANDBY • נתראה באירוע הבא! ⚡</h2>
      <p class="sub-message">
        תודה שהרעדתם את הרחבה ללא הפסקה! מערכת בקשות האורחים סגורה. נשוב להפיל את הבאס באירוע הבא.
      </p>

      <a class="social-btn" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        שמעו סטים חיים ב-YouTube
      </a>

      <a class="secondary-btn" href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path></svg>
        עקבו באינסטגרם לעדכוני מסיבות
      </a>
    </div>
  </div>

  <footer>
    LASER ARENA &bull; DJ SHAZZ &amp; DJ SONIC &bull; ONYX
  </footer>

  <script>
    // Dynamic Sweeping Rave Lasers
    const canvas = document.getElementById('laser-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;

    window.addEventListener('pointermove', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });

    let angle = 0;
    function renderLasers() {
      ctx.fillStyle = 'rgba(2, 2, 4, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      angle += 0.025;
      const w = canvas.width;
      const h = canvas.height;

      // Laser Origin Points
      const origins = [
        { x: 0, y: 0, color: '#00ff88' },
        { x: w, y: 0, color: '#ff007f' },
        { x: w / 2, y: 0, color: '#00e5ff' }
      ];

      origins.forEach((orig, idx) => {
        const sweepX = (w / 2) + Math.sin(angle + idx * 1.5) * (w * 0.45);
        const sweepY = h * 0.75 + Math.cos(angle * 0.8 + idx) * 80;

        // Laser beam
        ctx.beginPath();
        ctx.moveTo(orig.x, orig.y);
        ctx.lineTo(sweepX, sweepY);
        ctx.strokeStyle = orig.color;
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 18;
        ctx.shadowColor = orig.color;
        ctx.stroke();

        // Laser impact glow
        ctx.beginPath();
        ctx.arc(sweepX, sweepY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 25;
        ctx.shadowColor = orig.color;
        ctx.fill();
      });

      requestAnimationFrame(renderLasers);
    }
    renderLasers();
  </script>
</body>
</html>
